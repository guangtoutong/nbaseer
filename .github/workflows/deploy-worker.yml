name: Deploy Worker

on:
  push:
    branches:
      - master
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      # Worker secrets persist across deploys, so this only needs to run when the key
      # is added or rotated. It is skipped when the repo secret is unset: passing an
      # empty value to `wrangler secret put` is what failed every deploy from
      # 2026-03-28 onward, which silently froze the data pipeline for six months.
      - name: Sync ODDS_API_KEY
        if: env.ODDS_API_KEY != ''
        working-directory: worker
        run: printf '%s' "$ODDS_API_KEY" | npx wrangler secret put ODDS_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

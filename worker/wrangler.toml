name = "nbaseer-worker"
account_id = "371932342a48f3c3e71ac3588a19e0c5"
main = "index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "nbaseer-db"
database_id = "f829cafa-9562-47fd-b4e2-70684a9f78a6"

# Scores need to move during games; every 10 minutes keeps the live view honest.
# Predictions and bookmaker odds are rate-limited inside the worker itself.
[triggers]
crons = ["*/10 * * * *"]

# ODDS_API_KEY is a Worker secret. Set it once with:
#   npx wrangler secret put ODDS_API_KEY
# or via the GitHub Actions secret of the same name. It is optional — without it
# the model runs on its own ratings instead of blending in the market.
